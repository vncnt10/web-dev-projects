
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BLEACH | Anime Details</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --black: #101114;
      --dark: #191b20;
      --card: #202229;
      --red: #a51f32;
      --red-light: #d43b4e;
      --gold: #c5a66b;
      --cream: #eee9df;
      --muted: #999ba3;
    }

    body {
      background: var(--black);
      color: var(--cream);
      font-family: 'Inter', sans-serif;
    }

    .navbar {
      background: var(--black);
      border-bottom: 1px solid #34353a;
    }

    .brand {
      font-family: 'Cinzel', serif;
      font-weight: 800;
      letter-spacing: 5px;
      color: var(--cream);
      text-decoration: none;
    }

    .brand span { color: var(--red-light); }

    .section-label {
      color: var(--gold);
      letter-spacing: 4px;
      font-size: .72rem;
      font-weight: 700;
    }

    .section-title {
      font-family: 'Cinzel', serif;
      font-weight: 700;
    }

    .detail-card {
      background: var(--card);
      border: 1px solid #34353c;
      border-radius: 6px;
    }

    .poster {
      width: 100%;
      max-width: 290px;
      border-radius: 5px;
      border: 1px solid #444;
    }

    .anime-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.8rem, 5vw, 3.2rem);
      font-weight: 800;
    }

    .score {
      color: var(--gold);
      font-size: 1.2rem;
      font-weight: 700;
    }

    .description {
      color: #c4c1bc;
      line-height: 1.9;
      font-size: .94rem;
    }

    .stat-box {
      background: #181a1f;
      border: 1px solid #373840;
      padding: 15px;
      border-radius: 4px;
      height: 100%;
    }

    .stat-label {
      color: var(--muted);
      font-size: .72rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .stat-value {
      color: var(--cream);
      font-weight: 700;
      margin-top: 6px;
    }

    .genre {
      display: inline-block;
      background: rgba(165,31,50,.17);
      border: 1px solid var(--red);
      color: #edabb3;
      border-radius: 3px;
      padding: 6px 12px;
      margin: 4px 3px 4px 0;
      font-size: .76rem;
    }

    .btn-red {
      background: var(--red);
      border: 1px solid var(--red);
      color: white;
      border-radius: 4px;
      padding: 10px 20px;
    }

    .btn-red:hover {
      background: var(--red-light);
      border-color: var(--red-light);
      color: white;
    }

    .character-card {
      background: var(--card);
      border: 1px solid #34353c;
      border-radius: 5px;
      overflow: hidden;
      height: 100%;
      transition: .2s;
    }

    .character-card:hover {
      border-color: var(--red-light);
      transform: translateY(-4px);
    }

    .character-image {
      height: 210px;
      width: 100%;
      object-fit: cover;
      background: #292a30;
    }

    .character-name {
      font-weight: 700;
      font-size: .88rem;
    }

    .voice-actor {
      color: var(--muted);
      font-size: .75rem;
    }

    .loading {
      color: var(--gold);
      letter-spacing: 2px;
    }

    footer {
      border-top: 1px solid #34353a;
      color: var(--muted);
    }
  </style>
</head>

<body>

<nav class="navbar sticky-top">
  <div class="container py-3">
    <a class="brand" href="index.html">BLEACH<span>.</span></a>
    <span class="text-secondary small">ANIME ARCHIVE</span>
  </div>
</nav>

<main class="container py-4">

  <a href="index.html" id="backlink"
     class="btn btn-outline-light btn-sm mb-4">
    ← BACK TO COLLECTION
  </a>

  <div id="animeDetails">
    <div class="text-center py-5 loading">
      <div class="spinner-border mb-3"></div>
      <p>RETRIEVING ANIME RECORD...</p>
    </div>
  </div>

  <section class="mt-5">
    <div class="section-label mb-2">THE CAST</div>
    <h2 class="section-title mb-4">Main Characters</h2>

    <div class="row g-3" id="characters">
      <div class="col-12 text-center py-4 loading">
        Loading characters...
      </div>
    </div>
  </section>

</main>

<footer class="py-4 mt-5">
  <div class="container text-center">
    <div class="brand mb-2">BLEACH<span>.</span></div>
    <small>SOUL SOCIETY ARCHIVE · Powered by Jikan API v4</small>
  </div>
</footer>

<script>
  const API_URL = "https://api.tenrai.org/v1";

  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  const page = params.get("page") || 1;
  const query = params.get("q") || "Bleach";

  const detailsContainer = document.getElementById("animeDetails");
  const charactersContainer = document.getElementById("characters");

  document.getElementById("backlink").href =
    `index.html?page=${page}&q=${encodeURIComponent(query)}`;

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    })[char]);
  }

  async function fetchAnime() {
    if (!id || !/^\d+$/.test(id)) {
      detailsContainer.innerHTML = `
        <div class="alert alert-danger">
          Invalid anime ID. Please return to the collection.
        </div>`;
      charactersContainer.innerHTML = "";
      return;
    }

    try {
      const response = await fetch(`${API_URL}/anime/${id}/full`);

      if (!response.ok) {
        throw new Error("Anime information could not be retrieved.");
      }

      const result = await response.json();
      const anime = result.data;

      displayAnime(anime);

      // Wait briefly before the next request.
      await new Promise(resolve => setTimeout(resolve, 400));

      await fetchCharacters();

    } catch (error) {
      detailsContainer.innerHTML = `
        <div class="alert alert-danger">
          ${escapeHTML(error.message)}
        </div>`;
      charactersContainer.innerHTML = "";
    }
  }

  function displayAnime(anime) {
    const image = anime.images?.jpg?.large_image_url ||
                  anime.images?.jpg?.image_url || "";

    const genres = anime.genres || [];
    const themes = anime.themes || [];
    const studios = anime.studios || [];

    const title = anime.title || "Unknown Anime";

    document.title = `${title} | BLEACH Archive`;

    detailsContainer.innerHTML = `
      <div class="detail-card p-3 p-md-5">
        <div class="row g-4 align-items-start">

          <div class="col-12 col-md-4 text-center">
            <img src="${escapeHTML(image)}"
                 class="poster"
                 alt="${escapeHTML(title)}">
          </div>

          <div class="col-12 col-md-8">

            <div class="section-label mb-3">
              ANIME RECORD #${anime.mal_id}
            </div>

            <h1 class="anime-title">${escapeHTML(title)}</h1>

            <div class="mb-3">
              <span class="score">★ ${anime.score ?? "N/A"}</span>
              <span class="text-secondary ms-2">
                ${anime.scored_by ? Number(anime.scored_by).toLocaleString() + " ratings" : ""}
              </span>
            </div>

            <div class="mb-4">
              ${genres.map(g => `
                <span class="genre">${escapeHTML(g.name)}</span>
              `).join("")}
            </div>

            <div class="row g-3 mb-4">

              <div class="col-6 col-lg-4">
                <div class="stat-box">
                  <div class="stat-label">Episodes</div>
                  <div class="stat-value">${anime.episodes ?? "N/A"}</div>
                </div>
              </div>

              <div class="col-6 col-lg-4">
                <div class="stat-box">
                  <div class="stat-label">Status</div>
                  <div class="stat-value">${escapeHTML(anime.status || "N/A")}</div>
                </div>
              </div>

              <div class="col-6 col-lg-4">
                <div class="stat-box">
                  <div class="stat-label">Year</div>
                  <div class="stat-value">${anime.year ?? anime.aired?.prop?.from?.year ?? "N/A"}</div>
                </div>
              </div>

              <div class="col-6 col-lg-4">
                <div class="stat-box">
                  <div class="stat-label">Season</div>
                  <div class="stat-value">${escapeHTML(anime.season || "N/A")}</div>
                </div>
              </div>

              <div class="col-6 col-lg-4">
                <div class="stat-box">
                  <div class="stat-label">Rating</div>
                  <div class="stat-value">${escapeHTML(anime.rating || "N/A")}</div>
                </div>
              </div>

              <div class="col-6 col-lg-4">
                <div class="stat-box">
                  <div class="stat-label">Type</div>
                  <div class="stat-value">${escapeHTML(anime.type || "N/A")}</div>
                </div>
              </div>

            </div>

            <div class="section-label mb-2">SYNOPSIS</div>
            <p class="description">
              ${escapeHTML(anime.synopsis || "No synopsis available.")}
            </p>

            <div class="mt-4">
              <div class="section-label mb-2">STUDIOS</div>
              <p class="text-secondary">
                ${studios.length
                  ? studios.map(s => escapeHTML(s.name)).join(", ")
                  : "Not available"}
              </p>
            </div>

            <div class="mt-3">
              <div class="section-label mb-2">THEMES</div>
              <p class="text-secondary">
                ${themes.length
                  ? themes.map(t => escapeHTML(t.name)).join(", ")
                  : "Not available"}
              </p>
            </div>

            ${anime.trailer?.url ? `
              <a href="${escapeHTML(anime.trailer.url)}"
                 target="_blank"
                 rel="noopener noreferrer"
                 class="btn btn-red mt-3">
                WATCH TRAILER ↗
              </a>
            ` : ""}

          </div>
        </div>
      </div>`;
  }

  async function fetchCharacters() {
    try {
      const response = await fetch(
        `${API_URL}/anime/${id}/characters`
      );

      if (!response.ok) {
        throw new Error("Characters could not be loaded.");
      }

      const result = await response.json();

      displayCharacters(result.data);

    } catch (error) {
      charactersContainer.innerHTML = `
        <div class="col-12 text-secondary">
          ${escapeHTML(error.message)}
        </div>`;
    }
  }

  function displayCharacters(characters) {
    const mainCharacters = characters.slice(0, 12);

    if (!mainCharacters.length) {
      charactersContainer.innerHTML = `
        <div class="col-12 text-secondary">
          No characters available.
        </div>`;
      return;
    }

    charactersContainer.innerHTML = mainCharacters.map(item => {
      const character = item.character;
      const voiceActors = (item.voice_actors || [])
        .filter(actor => actor.language === "Japanese")
        .map(actor => actor.person.name);

      const image = character.images?.jpg?.image_url || "";

      return `
        <div class="col-6 col-md-4 col-lg-3">
          <div class="character-card">

            <img src="${escapeHTML(image)}"
                 class="character-image"
                 alt="${escapeHTML(character.name)}"
                 loading="lazy">

            <div class="p-3">
              <div class="character-name">
                ${escapeHTML(character.name)}
              </div>

              <div class="voice-actor mt-2">
                VOICE ACTOR
              </div>

              <div class="text-secondary small">
                ${voiceActors.length
                  ? voiceActors.map(escapeHTML).join(", ")
                  : "Not available"}
              </div>
            </div>

          </div>
        </div>`;
    }).join("");
  }

  fetchAnime();
</script>

</body>
</html>
