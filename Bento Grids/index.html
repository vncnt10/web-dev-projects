<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Bento Ba?</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111;
    }

.gallery {
  width: 100%;
  height: 100dvh;
  padding: 12px;

  display: flex;
  justify-content: center;
  align-items: center;
}

.bento-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  grid-template-rows: repeat(3, minmax(0, 1fr));
  gap: 10px;

  width: min(100%, 90vh);
  aspect-ratio: 4 / 3;
  margin: auto;
}

.photo {
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  border-radius: 12px;
  background: #242424;
}

.photo img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform .45s ease;
}

.photo img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform .45s ease;
}



.p1 { grid-area: 1 / 1 / 2 / 2; }
.p2 { grid-area: 2 / 1 / 4 / 2; }
.p3 { grid-area: 1 / 2 / 2 / 3; }
.p4 { grid-area: 1 / 3 / 2 / 5; }
.p5 { grid-area: 2 / 2 / 3 / 4; }
.p6 { grid-area: 2 / 4 / 3 / 5; }
.p7 { grid-area: 3 / 2 / 4 / 4; }
.p8 { grid-area: 3 / 4 / 3 / 4; }

  </style>
</head>

<body>
  <main class="container-fluid gallery">
    <div class="bento-grid">

      <div class="photo p1">
        <img src="/Bento Grids/images/p1 bento grid.jpg" alt="">
      </div>

      <div class="photo p2">
        <img src="/Bento Grids/images/p2 2grid.jpg" alt="">
      </div>

      <div class="photo p3">
        <img src="/Bento Grids/images/p3 bento grid.jpg" alt="">
      </div>

      <div class="photo p4">
        <img src="/Bento Grids/images/p2 gridd.jpg" alt="">
      </div>

      <div class="photo p5">
        <img src="/Bento Grids/images/lambo grid 3.jpg" alt="">
      </div>

      <div class="photo p6">
        <img src="/Bento Grids/images/p66 bento grid.jpg" alt="">
      </div>

      <div class="photo p7">
        <img src="/Bento Grids/images/p7 bento grid.jpg" alt="">
      </div>

      <div class="photo p8">
        <img src="/Bento Grids/images/p8 bento grid.jpg" alt="">
      </div>
    </div>
  </main>
</body>
</html>
