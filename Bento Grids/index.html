<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Bento Ba?</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111;
    }

.gallery {
  width: 100%;
  height: 100dvh;
  padding: 12px;

  display: flex;
  justify-content: center;
  align-items: center;
}

.bento-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  grid-template-rows: repeat(3, minmax(0, 1fr));
  gap: 10px;

  width: min(100%, 90vh);
  aspect-ratio: 4 / 3;
  margin: auto;
}

.photo {
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  border-radius: 12px;
  background: #242424;
}

.photo img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform .45s ease;
}

.photo img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform .45s ease;
}



.p1 { grid-area: 1 / 1 / 2 / 2; }
.p2 { grid-area: 2 / 1 / 4 / 2; }
.p3 { grid-area: 1 / 2 / 2 / 3; }
.p4 { grid-area: 1 / 3 / 2 / 5; }
.p5 { grid-area: 2 / 2 / 3 / 4; }
.p6 { grid-area: 2 / 4 / 3 / 5; }
.p7 { grid-area: 3 / 2 / 4 / 4; }
.p8 { grid-area: 3 / 4 / 3 / 4; }

  </style>
</head>

<body>
  <main class="container-fluid gallery">
    <div class="bento-grid">

      <div class="photo p1">
        <img src="https://i.pinimg.com/736x/f3/c7/67/f3c767fe0e538596e8994383f089fc14.jpg" alt="">
      </div>

      <div class="photo p2">
        <img src="https://img.freepik.com/premium-photo/new-black-lamborghini-car_1131377-311.jpg" alt="">
      </div>

      <div class="photo p3">
        <img src="https://i1.sndcdn.com/artworks-5NkMzaN7u81nHTaY-1NisAw-t1080x1080.jpg" alt="">
      </div>

      <div class="photo p4">
        <img src="https://wallup.net/wp-content/uploads/2019/09/58152-aventador-black-lp700-4-lamborghini-supercars.jpg" alt="">
      </div>

      <div class="photo p5">
        <img src="https://tse1.mm.bing.net/th/id/OIP.haNKV4OX4KXSGZiqws2WCAHaEo?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="">
      </div>

      <div class="photo p6">
        <img src="https://4kwallpapers.com/images/wallpapers/lamborghini-si-n-7680x4320-17143.jpg" alt="">
      </div>

      <div class="photo p7">
        <img src="https://wallpapercave.com/wp/CSQQ2yF.jpg" alt="">
      </div>

      <div class="photo p8">
        <img src="https://wallup.net/wp-content/uploads/2019/09/58152-aventador-black-lp700-4-lamborghini-supercars.jpg" alt="">
      </div>
    </div>
  </main>
</body>
</html>
